# General
# Font Settings
font=IosevkaTerm NFM:style=Regular:size=16
font-bold=IosevkaTerm NFM:style=Regular:size=16
font-italic=IosevkaTerm NFM:style=Italic:size=16
font-bold-italic=IosevkaTerm NFM SemiBold:style=SemiBold Italic:size=16
# Padding
pad=10x5

[mouse]
hide-when-typing=yes

[csd]
preferred = none

[key-bindings]
scrollback-up-half-page=Alt+k
scrollback-down-half-page=Alt+j
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n

[mouse-bindings]
scrollback-up-mouse=BTN_WHEEL_BACK
scrollback-down-mouse=BTN_WHEEL_FORWARD
font-increase=Control+BTN_WHEEL_BACK
font-decrease=Control+BTN_WHEEL_FORWARD

[colors-dark]
cursor=242933 ebcb8b
foreground=C0C8D8
background=242933
